<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Engr. Nana Kwame Obeng-Ahenkora, Ph.D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blueprint:#0d3a5c;
    --blueprint-line:#2f6a94;
    --blueprint-line-soft:rgba(120,180,220,0.16);
    --card:#0f4267;
    --ink:#eaf2f8;
    --muted:#9cc2dc;
    --accent:#ff6b35;
    --accent-dark:#e5501c;
    --line:#1c5580;
    --danger:#ff8a7a;
    --ok:#7fe0b5;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background-color:var(--blueprint);
    background-image:
      linear-gradient(var(--blueprint-line-soft) 1px, transparent 1px),
      linear-gradient(90deg, var(--blueprint-line-soft) 1px, transparent 1px);
    background-size:28px 28px;
    color:var(--ink);
    padding:24px;
    min-height:100vh;
  }
  .wrap{max-width:760px;margin:0 auto;position:relative;}
  .stamp{
    position:absolute; top:-6px; right:0;
    border:2px solid var(--accent);
    color:var(--accent);
    font-family:'Space Mono',monospace;
    font-size:0.65rem;
    letter-spacing:0.12em;
    padding:5px 10px;
    border-radius:4px;
    transform:rotate(4deg);
    text-transform:uppercase;
    opacity:0.85;
  }
  h1{
    font-family:'Space Mono',monospace;
    font-size:1.7rem;
    font-weight:700;
    margin-bottom:4px;
    letter-spacing:-0.01em;
    color:#fff;
  }
  h1::before{ content:"// "; color:var(--accent); }
  .title{font-family:'Space Mono',monospace;font-size:0.85rem;color:var(--accent);margin-top:0;margin-bottom:24px;letter-spacing:0.03em;}
  h2{font-family:'Space Mono',monospace;font-size:1rem;color:var(--accent);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:10px;margin-top:0;}
  .tabs{display:flex;gap:2px;margin-bottom:20px;border:1px solid var(--line);border-radius:10px;padding:3px;background:rgba(0,0,0,0.15);}
  .tab{flex:1;padding:10px 14px;text-align:center;border-radius:7px;background:transparent;border:none;cursor:pointer;font-weight:600;color:var(--muted);font-size:0.9rem;letter-spacing:0.02em;}
  .tab.active{background:var(--accent);color:#1a1a1a;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:24px;margin-bottom:16px;box-shadow:0 4px 18px rgba(0,0,0,0.25);}
  .card p{line-height:1.6;color:var(--ink);white-space:pre-wrap;}
  label{display:block;font-size:0.78rem;font-weight:700;margin-bottom:7px;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;}
  input[type=text], input[type=password], textarea{
    width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:6px;
    font-size:0.95rem;font-family:'Space Mono',monospace;margin-bottom:14px;
    background:rgba(0,0,0,0.2);color:var(--ink);
  }
  textarea{min-height:120px;resize:vertical;}
  input:focus, textarea:focus{outline:2px solid var(--accent);outline-offset:1px;}
  button{background:var(--accent);color:#1a1a1a;border:none;padding:11px 20px;border-radius:6px;font-weight:700;cursor:pointer;font-size:0.9rem;letter-spacing:0.02em;text-transform:uppercase;}
  button:hover{background:var(--accent-dark);color:#fff;}
  button:disabled{opacity:0.5;cursor:not-allowed;}
  a.portal-btn{display:inline-block;text-decoration:none;}
  .msg{padding:10px 12px;border-radius:6px;margin-bottom:14px;font-size:0.88rem;font-family:'Space Mono',monospace;border-left:3px solid transparent;}
  .msg.ok{background:rgba(127,224,181,0.12);color:var(--ok);border-left-color:var(--ok);}
  .msg.err{background:rgba(255,138,122,0.12);color:var(--danger);border-left-color:var(--danger);}
  .hidden{display:none;}
  .pub-list{padding-left:0;list-style:none;}
  .pub-list li{padding:10px 0;border-bottom:1px solid var(--line);font-size:0.92rem;color:var(--ink);}
  .pub-list li:last-child{border-bottom:none;}
  .contact-line{font-family:'Space Mono',monospace;font-size:0.92rem;color:var(--ink);margin:4px 0;}
</style>
</head>
<body>
<div class="wrap">
  <div class="stamp">Verified</div>
  <h1>Engr. Nana Kwame Obeng-Ahenkora</h1>
  <p class="title">Ph.D &nbsp;|&nbsp; Dept. of Civil &amp; Environmental Engineering</p>

  <div class="tabs">
    <div class="tab active" id="tabView" onclick="switchTab('view')">Home</div>
    <div class="tab" id="tabEdit" onclick="switchTab('edit')">Edit Info</div>
  </div>

  <!-- VIEW MODE -->
  <div id="viewMode">
    <div class="card">
      <h2>About</h2>
      <p id="bioDisplay">Loading...</p>
    </div>

    <div class="card">
      <h2>Contact</h2>
      <div id="contactDisplay">Loading...</div>
    </div>

    <div class="card">
      <h2>Publications &amp; Research</h2>
      <ul class="pub-list" id="pubDisplay"><li>Loading...</li></ul>
    </div>

    <div class="card" style="text-align:center;">
      <h2>Assessment Portal</h2>
      <p style="margin-bottom:16px;">Upload and check course assessment results, or report a course-related issue.</p>
      <a class="portal-btn" href="portal.html"><button>Go to Assessment Portal</button></a>
    </div>
  </div>

  <!-- EDIT MODE -->
  <div id="editMode" class="hidden">
    <div class="card" id="loginCard">
      <label>Passcode</label>
      <input type="password" id="passcodeInput" placeholder="Enter passcode">
      <button onclick="checkPasscode()">Unlock</button>
      <div id="loginMsg"></div>
    </div>

    <div class="card hidden" id="editCard">
      <label>Bio</label>
      <textarea id="bioInput" placeholder="Write a few sentences about yourself..."></textarea>

      <label>Contact (one item per line, e.g. "Email: name@school.edu")</label>
      <textarea id="contactInput" placeholder="Email: name@school.edu&#10;Office: Dept of Civil &amp; Env. Engineering, Room 12&#10;Phone: +233..."></textarea>

      <label>Publications / Research (one per line)</label>
      <textarea id="pubInput" placeholder="Title of paper, Journal, Year&#10;Another publication title..."></textarea>

      <button id="saveBtn" onclick="saveProfile()">Save Changes</button>
      <div id="saveMsg"></div>
    </div>
  </div>
</div>

<script>
// ===== JSONBin.io configuration (same storage as the assessment portal) =====
const JSONBIN_BIN_ID = "6a82b31bf5f4af5e291f5192";
const JSONBIN_API_KEY = "$2a$10$8LR9Xhpx/2..ijpG64X7ieygBgDkCWW7/YK0SodYI8Qyk4zF7TETO";
const JSONBIN_URL = `https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`;
// =============================================================================

const PASSCODE = "teacher123"; // same passcode as the portal's Teacher tab; change if you'd like a different one here

function switchTab(tab){
  document.getElementById('viewMode').classList.toggle('hidden', tab!=='view');
  document.getElementById('editMode').classList.toggle('hidden', tab!=='edit');
  document.getElementById('tabView').classList.toggle('active', tab==='view');
  document.getElementById('tabEdit').classList.toggle('active', tab==='edit');
}

async function fetchBin(){
  const res = await fetch(`${JSONBIN_URL}/latest`, {
    headers: { "X-Master-Key": JSONBIN_API_KEY }
  });
  if(!res.ok) throw new Error("Could not reach storage");
  const data = await res.json();
  return data.record || {};
}

async function saveBin(binData){
  const res = await fetch(JSONBIN_URL, {
    method: "PUT",
    headers: { "Content-Type": "application/json", "X-Master-Key": JSONBIN_API_KEY },
    body: JSON.stringify(binData)
  });
  if(!res.ok) throw new Error("Could not save to storage");
  return res.json();
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

async function loadProfile(){
  try{
    const bin = await fetchBin();
    const profile = bin.profile || {};
    document.getElementById('bioDisplay').textContent = profile.bio || "No bio added yet.";

    const contactLines = (profile.contact || "").split('\n').filter(l => l.trim());
    document.getElementById('contactDisplay').innerHTML = contactLines.length
      ? contactLines.map(l => `<div class="contact-line">${escapeHtml(l)}</div>`).join('')
      : "No contact info added yet.";

    const pubLines = (profile.publications || "").split('\n').filter(l => l.trim());
    document.getElementById('pubDisplay').innerHTML = pubLines.length
      ? pubLines.map(l => `<li>${escapeHtml(l)}</li>`).join('')
      : "<li>No publications added yet.</li>";

    // pre-fill edit fields too
    document.getElementById('bioInput').value = profile.bio || "";
    document.getElementById('contactInput').value = profile.contact || "";
    document.getElementById('pubInput').value = profile.publications || "";
  }catch(e){
    document.getElementById('bioDisplay').textContent = "Could not load profile info.";
  }
}

function checkPasscode(){
  const val = document.getElementById('passcodeInput').value;
  const msg = document.getElementById('loginMsg');
  if(val === PASSCODE){
    document.getElementById('loginCard').classList.add('hidden');
    document.getElementById('editCard').classList.remove('hidden');
  } else {
    msg.innerHTML = '<div class="msg err">Incorrect passcode.</div>';
  }
}

async function saveProfile(){
  const bio = document.getElementById('bioInput').value.trim();
  const contact = document.getElementById('contactInput').value.trim();
  const publications = document.getElementById('pubInput').value.trim();
  const msg = document.getElementById('saveMsg');
  const btn = document.getElementById('saveBtn');

  btn.disabled = true;
  msg.innerHTML = '<div class="msg ok">Saving...</div>';

  try{
    const bin = await fetchBin();
    bin.profile = { bio, contact, publications };
    await saveBin(bin);
    msg.innerHTML = '<div class="msg ok">Saved. Your changes are now live.</div>';
    loadProfile();
  }catch(e){
    msg.innerHTML = `<div class="msg err">Could not save: ${escapeHtml(e.message)}</div>`;
  }finally{
    btn.disabled = false;
  }
}

window.addEventListener('DOMContentLoaded', loadProfile);
</script>
</body>
</html>
