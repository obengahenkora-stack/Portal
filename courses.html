<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Courses</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b2545">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html{ font-size:17px; }
  :root{
    --navy:#0b2545; --navy-dark:#071a33; --gold:#d4a017; --gold-dark:#b5860e;
    --bg:#f5f7fa; --card:#ffffff; --ink:#1a2433; --muted:#64748b;
    --line:#e3e8ef; --danger:#c0392b; --ok:#1f8a4c;
  }
  *{box-sizing:border-box;}
  body{ margin:0; font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:var(--bg); color:var(--ink); min-height:100vh; }
  .hero{
    background:linear-gradient(135deg, var(--navy) 0%, var(--navy-dark) 100%);
    color:#fff; padding:40px 24px 56px; text-align:center; position:relative;
  }
  .hero::after{ content:""; position:absolute; bottom:-1px; left:0; width:100%; height:6px; background:linear-gradient(90deg, var(--gold), #fff2, var(--gold)); }
  .hero h1{ color:#fff; font-family:'Poppins',sans-serif; margin-bottom:4px; }
  .hero p{ color:rgba(255,255,255,0.75); font-size:0.9rem; margin:0; }
  .hero-tabs{
    display:flex;gap:6px;margin:-30px auto 24px;max-width:760px;
    background:#fff;border-radius:12px;padding:6px;box-shadow:0 4px 18px rgba(0,0,0,0.1);position:relative;z-index:2;
  }
  .hero-tabs a, .hero-tabs .tab-static{
    flex:1;padding:10px 14px;text-align:center;border-radius:8px;background:transparent;
    cursor:pointer;font-weight:600;color:var(--muted);font-size:0.9rem;font-family:'Inter',sans-serif;text-decoration:none;
  }
  .hero-tabs .active{ background:var(--navy); color:#fff; }
  .wrap{ max-width:760px; margin:0 auto; padding:0 24px 40px; }
  .course-card{
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:20px 22px; margin-bottom:14px; display:flex; justify-content:space-between; align-items:center;
    text-decoration:none; color:var(--ink); box-shadow:0 2px 10px rgba(15,30,60,0.05);
    transition:transform 0.15s ease, box-shadow 0.15s ease;
  }
  .course-card:hover{ transform:translateY(-2px); box-shadow:0 8px 24px rgba(15,30,60,0.1); }
  .course-name{ font-family:'Poppins',sans-serif; font-weight:700; font-size:1.05rem; color:var(--navy); }
  .course-arrow{ color:var(--gold); font-size:1.3rem; }
  .empty{ color:var(--muted); font-size:0.9rem; padding:20px 0; text-align:center; }
  .theme-toggle{
    position:fixed; bottom:24px; left:24px; z-index:50; width:48px;height:48px;border-radius:50%;
    background:#fff;color:#0b2545;border:1px solid #e3e8ef;font-size:1.2rem;box-shadow:0 4px 14px rgba(0,0,0,0.15);
    cursor:pointer;display:flex;align-items:center;justify-content:center;
  }
  [data-theme="dark"]{ --bg:#0f172a; --card:#1a2740; --ink:#e8edf5; --muted:#9aabc4; --line:#2c3d5c; }
  [data-theme="dark"] body{ background:var(--bg); color:var(--ink); }
  [data-theme="dark"] .theme-toggle{ background:#1a2740; color:#d4a017; border-color:#2c3d5c; }
</style>
</head>
<body>
<button class="theme-toggle" id="themeToggleBtn" onclick="toggleDarkMode()" title="Toggle dark mode">🌙</button>

<div class="hero">
  <h1>Courses</h1>
  <p>Browse each course's syllabus, announcements, and lecture notes in one place.</p>
</div>

<div class="hero-tabs">
  <a href="index.html">Home</a>
  <a href="blog.html">Blog</a>
  <div class="tab-static active">Courses</div>
  <a href="portal.html">Assessment Portal</a>
</div>

<div class="wrap">
  <div id="coursesList"><div class="empty">Loading courses...</div></div>
</div>

<script>
const SUPABASE_URL = "https://mdbhlndjuddymvderuun.supabase.co";
const SUPABASE_KEY = "sb_publishable_K8BmlHVd_u4gIkx70yqxRw_PaZGnWnW";
const SUPABASE_BUCKET = "portal-data";
const SUPABASE_FILE = "site-data.json";

const JSONBIN_BIN_ID = "6a82b31bf5f4af5e291f5192";
const JSONBIN_API_KEY = "$2a$10$8LR9Xhpx/2..ijpG64X7ieygBgDkCWW7/YK0SodYI8Qyk4zF7TETO";
const JSONBIN_URL = `https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`;

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = String(str || '');
  return div.innerHTML;
}

async function fetchSupabaseData(){
  try{
    const res = await fetch(`${SUPABASE_URL}/storage/v1/object/public/${SUPABASE_BUCKET}/${SUPABASE_FILE}?t=${Date.now()}`, { cache: "no-store" });
    if(!res.ok) return {};
    return await res.json();
  }catch(e){ return {}; }
}

async function fetchJsonBinCourses(){
  try{
    const res = await fetch(`${JSONBIN_URL}/latest`, { headers: { "X-Master-Key": JSONBIN_API_KEY }, cache: "no-store" });
    if(!res.ok) return [];
    const data = await res.json();
    return (data.record && data.record.courses) || [];
  }catch(e){ return []; }
}

function initDarkMode(){
  const saved = localStorage.getItem('site_theme');
  if(saved === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  const btn = document.getElementById('themeToggleBtn');
  if(btn) btn.textContent = saved === 'dark' ? '☀️' : '🌙';
}
function toggleDarkMode(){
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  if(isDark){ document.documentElement.removeAttribute('data-theme'); localStorage.setItem('site_theme', 'light'); }
  else{ document.documentElement.setAttribute('data-theme', 'dark'); localStorage.setItem('site_theme', 'dark'); }
  const btn = document.getElementById('themeToggleBtn');
  if(btn) btn.textContent = isDark ? '🌙' : '☀️';
}

async function loadCourses(){
  const container = document.getElementById('coursesList');
  try{
    const [supaData, jsonBinCourses] = await Promise.all([fetchSupabaseData(), fetchJsonBinCourses()]);

    const courseSet = new Set(jsonBinCourses);
    (supaData.rosters ? Object.keys(supaData.rosters) : []).forEach(c => courseSet.add(c));
    (supaData.resources || []).forEach(r => { if(r.course) courseSet.add(r.course); });
    (supaData.announcements || []).forEach(a => { if(a.course) courseSet.add(a.course); });
    (supaData.syllabi ? Object.keys(supaData.syllabi) : []).forEach(c => courseSet.add(c));

    const courses = [...courseSet].filter(Boolean).sort();

    if(courses.length === 0){
      container.innerHTML = '<div class="empty">No courses set up yet. Add one from the Assessment Portal\'s Teacher tab, or upload a roster/resource/announcement for a course.</div>';
      return;
    }

    container.innerHTML = courses.map(c => `
      <a class="course-card" href="course.html?course=${encodeURIComponent(c)}">
        <span class="course-name">${escapeHtml(c)}</span>
        <span class="course-arrow">&rarr;</span>
      </a>
    `).join('');
  }catch(e){
    container.innerHTML = '<div class="empty">Could not load courses.</div>';
  }
}

window.addEventListener('DOMContentLoaded', () => {
  initDarkMode();
  loadCourses();
});
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
