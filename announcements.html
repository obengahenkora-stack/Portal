<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Announcements</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d0d0b">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700;9..144,900&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --navy:#0d0d0b; --navy-dark:#000000; --gold:#3f7a32; --gold-dark:#2f5f26;
    --bg:#ffffff; --card:#faf8f3; --ink:#181816; --muted:#726b5c;
    --line:#e2ded2; --danger:#b3261e; --ok:#3f7a32; --red:#b3261e; --red-dark:#8f1e18;
  }
  *{box-sizing:border-box;}
  body{ margin:0; font-family:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:var(--bg); color:var(--ink); min-height:100vh; }
  .hero{
    background:linear-gradient(135deg, var(--navy) 0%, var(--navy-dark) 100%);
    color:#fff; padding:36px 24px 52px; text-align:center; position:relative;
  }
  .hero h1{ font-family:'Fraunces',sans-serif; font-size:1.8rem; margin:0 0 6px 0; }
  .hero p{ color:rgba(255,255,255,0.7); font-size:0.9rem; margin:0; }
  .hero-tabs{
    display:flex;flex-wrap:wrap;gap:6px;row-gap:6px;margin:-28px auto 24px;max-width:760px;
    background:#fff;border-radius:12px;padding:6px;box-shadow:0 4px 18px rgba(0,0,0,0.1);
    position:relative;z-index:2;
  }
  .hero-tabs a, .hero-tabs .tab-static{
    flex:1 1 auto;min-width:90px;padding:10px 14px;text-align:center;border-radius:8px;background:transparent;
    cursor:pointer;font-weight:600;color:var(--muted);font-size:0.85rem;font-family:'IBM Plex Sans',sans-serif;
    text-decoration:none;
  }
  .hero-tabs .active{ background:var(--navy); color:#fff; border-bottom:2px solid var(--red); }
  .wrap{max-width:760px;margin:0 auto;padding:0 24px 40px;}
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:10px;
    padding:22px; margin-bottom:16px; box-shadow:0 2px 10px rgba(15,30,60,0.04);
  }
  h2{ font-family:'Fraunces',sans-serif; font-size:1rem; color:var(--navy); margin:0 0 14px 0; }
  label{display:block;font-size:0.72rem;font-weight:600;margin-bottom:7px;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;font-family:'IBM Plex Mono',monospace;}
  input[type=text], input[type=password], textarea, select{
    width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:8px;
    font-size:0.95rem;font-family:'IBM Plex Sans',sans-serif;margin-bottom:14px;background:#f8f6f0;color:var(--ink);
  }
  textarea{min-height:100px;resize:vertical;}
  button{background:var(--accent, var(--gold));color:#fff;border:none;padding:11px 24px;border-radius:8px;font-weight:600;cursor:pointer;font-size:0.88rem;font-family:'IBM Plex Sans',sans-serif;}
  button:hover{opacity:0.9;}
  button.secondary{ background:transparent; color:var(--danger); border:1px solid var(--danger); }
  .msg{padding:10px 14px;border-radius:8px;margin-bottom:14px;font-size:0.85rem;}
  .msg.ok{background:rgba(63,122,50,0.08);color:var(--ok);}
  .msg.err{background:rgba(179,38,30,0.08);color:var(--danger);}
  .hidden{display:none;}
  .empty{color:var(--muted);font-size:0.9rem;padding:16px 0;text-align:center;}
  .post-date{font-size:0.75rem;color:var(--muted);}
</style>
</head>
<body>

<div class="hero">
  <h1>Announcements</h1>
  <p>Course-specific announcements and updates.</p>
</div>

<div class="hero-tabs">
  <a href="index.html">Home</a>
  <a href="lecture-hall.html">&larr; Lecture Hall</a>
  <div class="tab-static active">Announcements</div>
  <a href="portal.html">Faculty Console</a>
</div>

<div class="wrap">
  <div class="card">
    <label>Filter by Course</label>
    <select id="announcementCourseFilter" onchange="loadAnnouncementsList()">
      <option value="">All Courses</option>
    </select>
    <div id="announcementsList"><div class="empty">Loading announcements...</div></div>
  </div>

  <div id="loginCard" class="card">
    <label>Email</label>
    <input type="text" id="authEmailInput" placeholder="you@school.edu">
    <label>Password</label>
    <input type="password" id="authPasswordInput" placeholder="Your password">
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <button onclick="signInUser()">Sign In</button>
      <button class="secondary" onclick="signUpUser()">Create Account</button>
    </div>
    <div id="authMsg" style="margin-top:10px;"></div>
  </div>

  <div id="noRoleCard" class="card hidden">
    <div class="msg err">Your account doesn't have permission to post announcements.</div>
    <button class="secondary" onclick="signOutUser()">Sign Out</button>
  </div>

  <div id="postAnnouncementCard" class="card hidden">
    <h2>Post Announcement</h2>
    <label>Course</label>
    <input type="text" id="announcementCourseInput" placeholder="e.g. CIVL 368">
    <label>Announcement</label>
    <textarea id="announcementTextInput" placeholder="e.g. Class moved to Room 12 tomorrow."></textarea>
    <button id="postAnnouncementBtn" onclick="postAnnouncement()">Post Announcement</button>
    <div id="postAnnouncementMsg"></div>
  </div>

  <div id="manageAnnouncementsCard" class="card hidden">
    <h2>Manage Announcements</h2>
    <div id="manageAnnouncementsList"><div class="empty">Loading...</div></div>
  </div>

  <div id="signOutRow" class="hidden" style="text-align:center;">
    <button class="secondary" onclick="signOutUser()">Sign Out</button>
  </div>
</div>

<script>
const SUPABASE_URL = "https://mdbhlndjuddymvderuun.supabase.co";
const SUPABASE_KEY = "sb_publishable_K8BmlHVd_u4gIkx70yqxRw_PaZGnWnW";
const SUPABASE_BUCKET = "portal-data";
const SUPABASE_FILE = "site-data.json";
const OWNER_EMAIL = "obengahenkora@gmail.com";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUserRole = null;
let currentUserEmail = null;
function isOwner(){ return currentUserRole === 'owner'; }
function isAdmin(){ return currentUserRole === 'owner' || currentUserRole === 'admin'; }

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = String(str || '');
  return div.innerHTML;
}
function formatDate(iso){
  try{ return new Date(iso).toLocaleDateString(undefined, { year:'numeric', month:'long', day:'numeric' }); }
  catch(e){ return ''; }
}

async function fetchSupabaseData(){
  try{
    const res = await fetch(`${SUPABASE_URL}/storage/v1/object/public/${SUPABASE_BUCKET}/${SUPABASE_FILE}?t=${Date.now()}`, { cache: "no-store" });
    if(!res.ok) return {};
    return await res.json();
  }catch(e){ return {}; }
}
async function saveSupabaseData(data){
  const res = await fetch(`${SUPABASE_URL}/storage/v1/object/${SUPABASE_BUCKET}/${SUPABASE_FILE}`, {
    method: "POST", cache: "no-store",
    headers: { "Content-Type": "application/json", "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}`, "x-upsert": "true", "cache-control": "no-cache" },
    body: JSON.stringify(data)
  });
  if(!res.ok) throw new Error("Could not save");
  return true;
}

async function resolveCurrentUserRole(){
  const { data: { session } } = await supabaseClient.auth.getSession();
  if(!session){ currentUserRole = null; currentUserEmail = null; return; }
  const email = session.user.email.toLowerCase();
  currentUserEmail = email;
  if(email === OWNER_EMAIL.toLowerCase()){ currentUserRole = 'owner'; return; }
  try{
    const data = await fetchSupabaseData();
    const members = data.teamMembers || [];
    const me = members.find(m => (m.email || '').toLowerCase() === email);
    currentUserRole = me ? me.role : null;
  }catch(e){ currentUserRole = null; }
}

async function signUpUser(){
  const email = document.getElementById('authEmailInput').value.trim();
  const password = document.getElementById('authPasswordInput').value;
  const msg = document.getElementById('authMsg');
  if(!email || !password){ msg.innerHTML = '<div class="msg err">Enter an email and password.</div>'; return; }
  if(password.length < 6){ msg.innerHTML = '<div class="msg err">Password must be at least 6 characters.</div>'; return; }
  msg.innerHTML = '<div class="msg ok">Creating account...</div>';
  const { data, error } = await supabaseClient.auth.signUp({ email, password });
  if(error){ msg.innerHTML = `<div class="msg err">${escapeHtml(error.message)}</div>`; return; }
  if(data.session){ await onAuthReady(); }
  else{ msg.innerHTML = '<div class="msg ok">Account created. Check your email to confirm, then sign in.</div>'; }
}
async function signInUser(){
  const email = document.getElementById('authEmailInput').value.trim();
  const password = document.getElementById('authPasswordInput').value;
  const msg = document.getElementById('authMsg');
  if(!email || !password){ msg.innerHTML = '<div class="msg err">Enter your email and password.</div>'; return; }
  msg.innerHTML = '<div class="msg ok">Signing in...</div>';
  const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
  if(error){ msg.innerHTML = `<div class="msg err">${escapeHtml(error.message)}</div>`; return; }
  await onAuthReady();
}
async function signOutUser(){
  await supabaseClient.auth.signOut();
  location.reload();
}

async function onAuthReady(){
  await resolveCurrentUserRole();
  document.getElementById('loginCard').classList.add('hidden');
  document.getElementById('noRoleCard').classList.add('hidden');
  document.getElementById('postAnnouncementCard').classList.add('hidden');
  document.getElementById('manageAnnouncementsCard').classList.add('hidden');
  document.getElementById('signOutRow').classList.add('hidden');

  if(!currentUserRole){
    if(currentUserEmail){ document.getElementById('noRoleCard').classList.remove('hidden'); }
    else{ document.getElementById('loginCard').classList.remove('hidden'); }
    return;
  }

  document.getElementById('signOutRow').classList.remove('hidden');
  if(isAdmin()){
    document.getElementById('postAnnouncementCard').classList.remove('hidden');
    document.getElementById('manageAnnouncementsCard').classList.remove('hidden');
    loadManageAnnouncementsList();
  } else {
    document.getElementById('loginCard').classList.remove('hidden');
  }
}

async function postAnnouncement(){
  if(!isAdmin()){ document.getElementById('postAnnouncementMsg').innerHTML = '<div class="msg err">Only the Main Instructor can post announcements.</div>'; return; }
  const course = document.getElementById('announcementCourseInput').value.trim();
  const text = document.getElementById('announcementTextInput').value.trim();
  const msg = document.getElementById('postAnnouncementMsg');
  const btn = document.getElementById('postAnnouncementBtn');

  if(!course){ msg.innerHTML = '<div class="msg err">Please enter a course.</div>'; return; }
  if(!text){ msg.innerHTML = '<div class="msg err">Please write an announcement.</div>'; return; }

  btn.disabled = true;
  msg.innerHTML = '<div class="msg ok">Posting...</div>';

  try{
    const data = await fetchSupabaseData();
    const announcements = data.announcements || [];
    announcements.push({ id: 'ann_' + Date.now(), course, text, date: new Date().toISOString() });
    data.announcements = announcements;
    await saveSupabaseData(data);
    msg.innerHTML = '<div class="msg ok">Announcement posted.</div>';
    document.getElementById('announcementCourseInput').value = '';
    document.getElementById('announcementTextInput').value = '';
    loadManageAnnouncementsList();
    loadAnnouncementsList();
  }catch(e){
    msg.innerHTML = `<div class="msg err">Could not post: ${escapeHtml(e.message)}</div>`;
  }finally{
    btn.disabled = false;
  }
}

async function loadAnnouncementsList(){
  const container = document.getElementById('announcementsList');
  const filterSelect = document.getElementById('announcementCourseFilter');
  container.innerHTML = '<div class="empty">Loading...</div>';
  try{
    const data = await fetchSupabaseData();
    const announcements = (data.announcements || []).slice().sort((a,b) => new Date(b.date) - new Date(a.date));

    const courses = [...new Set(announcements.map(a => a.course))].sort();
    const currentFilter = filterSelect.value;
    filterSelect.innerHTML = '<option value="">All Courses</option>' + courses.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
    filterSelect.value = currentFilter;

    const filtered = currentFilter ? announcements.filter(a => a.course === currentFilter) : announcements;

    if(filtered.length === 0){
      container.innerHTML = '<div class="empty">No announcements yet.</div>';
      return;
    }
    container.innerHTML = filtered.map(a => `
      <div style="padding:14px 0;border-bottom:1px dashed var(--line);">
        <div style="font-weight:700;color:var(--gold-dark);font-size:0.78rem;text-transform:uppercase;margin-bottom:6px;">${escapeHtml(a.course)}</div>
        <div style="font-size:0.92rem;line-height:1.5;">${escapeHtml(a.text)}</div>
        <div class="post-date" style="margin-top:8px;">${formatDate(a.date)}</div>
      </div>
    `).join('');
  }catch(e){
    container.innerHTML = '<div class="empty">Could not load announcements.</div>';
  }
}

async function loadManageAnnouncementsList(){
  const container = document.getElementById('manageAnnouncementsList');
  container.innerHTML = '<div class="empty">Loading...</div>';
  try{
    const data = await fetchSupabaseData();
    const announcements = (data.announcements || []).slice().sort((a,b) => new Date(b.date) - new Date(a.date));
    if(announcements.length === 0){
      container.innerHTML = '<div class="empty">No announcements yet.</div>';
      return;
    }
    container.innerHTML = announcements.map(a => `
      <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line);">
        <div>
          <div style="font-family:'Fraunces',sans-serif;font-size:0.85rem;">[${escapeHtml(a.course)}] ${escapeHtml(a.text.slice(0,60))}${a.text.length>60?'...':''}</div>
          <div class="post-date">${formatDate(a.date)}</div>
        </div>
        <button class="secondary" style="padding:5px 12px;font-size:0.7rem;" onclick="deleteAnnouncement('${a.id}')">Delete</button>
      </div>
    `).join('');
  }catch(e){
    container.innerHTML = '<div class="empty">Could not load announcements.</div>';
  }
}

async function deleteAnnouncement(id){
  if(!isAdmin()){ alert('Only the Main Instructor can delete announcements.'); return; }
  if(!confirm('Delete this announcement?')) return;
  try{
    const data = await fetchSupabaseData();
    data.announcements = (data.announcements || []).filter(a => a.id !== id);
    await saveSupabaseData(data);
    loadManageAnnouncementsList();
    loadAnnouncementsList();
  }catch(e){
    alert('Could not delete announcement.');
  }
}

window.addEventListener('DOMContentLoaded', async () => {
  loadAnnouncementsList();
  await onAuthReady();
});
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
